datasources:
  default:
    # Allow JDBC_URL to override for in-container deployments (e.g. docker compose);
    # falls back to localhost for developers running the service outside a container.
    url: ${JDBC_URL:`jdbc:postgresql://localhost:5432/canmanager?currentSchema=%22canmanager-ws%22`}
    username: ${JDBC_USER:canmanager}
    password: ${JDBC_PASSWORD:password}

liquibase:
  datasources:
    default:
      contexts: test-data

logger:
  levels:
    com.thetealover: DEBUG
    org.hibernate.SQL: DEBUG

endpoints:
  env:
    enabled: true

# OpenAPI spec + Swagger UI are exposed only in the 'local' environment.
# Other envs (dev/test/default) leave these paths unmapped → 404.
micronaut:
  router:
    static-resources:
      swagger:
        paths: classpath:META-INF/swagger
        mapping: /swagger/**
      swagger-ui:
        paths: classpath:META-INF/swagger/views/swagger-ui
        mapping: /swagger-ui/**
