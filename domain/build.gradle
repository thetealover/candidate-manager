// Pure-Java domain module.
// No frameworks, no annotations from Micronaut/JPA — keeps business logic
// trivially unit-testable and prevents accidental coupling to infrastructure.

dependencies {
    api libs.slf4j.api

    testImplementation platform(libs.junit.bom)
    testImplementation libs.bundles.unit.test
    testRuntimeOnly    libs.junit.platform.launcher
}
